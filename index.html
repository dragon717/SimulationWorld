<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉普蒂河漫滩 · 模拟世界</title>
<style>
  :root {color-scheme:light; color:#233e34; background:#f4f1e8; font:16px Georgia,"Songti SC","Noto Serif CJK SC",serif}
  * {box-sizing:border-box}
  body {margin:0; min-height:100svh; display:grid; grid-template-rows:auto minmax(300px,1fr) auto}
  header, footer {display:flex; align-items:center; gap:12px 30px; padding:18px clamp(18px,4vw,70px); flex-wrap:wrap}
  header {justify-content:space-between; border-bottom:1px solid #c7c7b7}
  h1 {font-size:clamp(24px,3.8vw,45px); font-weight:500; margin:0; letter-spacing:.065em}
  header p {margin:0 0 5px; color:#667260; font-size:13px}
  nav {display:flex; gap:6px; flex-wrap:wrap}
  button, footer {font:14px system-ui,sans-serif}
  button {padding:8px 11px; border:1px solid transparent; border-radius:2px; background:transparent; color:inherit; cursor:pointer}
  button[aria-pressed=true] {color:#fffaf0; background:#385246}
  button:enabled:hover {border-color:#738775}
  button:focus-visible,canvas:focus-visible {outline:2px solid #976234; outline-offset:-2px}
  button:disabled {cursor:wait}
  main {position:relative; min-height:45svh; overflow:hidden; background:#e9e6da}
  main img,main canvas {display:block; width:100%; height:100%; position:absolute; inset:0; object-fit:contain}
  main [hidden] {display:none}
  #status {position:absolute; left:18px; bottom:10px; margin:0; padding:5px 9px; background:#fffcf0; font-size:14px}
  footer {justify-content:space-between; color:#546155; padding-block:12px}
  footer a {color:inherit}
  @media(max-width:620px) {header {gap:10px; padding-block:12px} nav {gap:2px} button {padding:7px} footer {font-size:12px; gap:6px}}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
<header>
  <div><p>尼泊尔 · 奇特旺</p><h1>拉普蒂河漫滩</h1></div>
  <nav aria-label="观察位置">
    <button disabled data-view="habitat" aria-pressed="true">全景</button>
    <button disabled data-view="chital" aria-pressed="false">花鹿</button>
    <button disabled data-view="tiger" aria-pressed="false">孟加拉虎</button>
    <button disabled data-view="mugger" aria-pressed="false">沼泽鳄</button>
  </nav>
</header>
<main id="viewport">
  <img src="previews/rapti-floodplain.jpg" alt="河道穿过草地，两头花鹿和一头孟加拉虎位于远岸，沼泽鳄伏在近岸浅水中。">
  <p role="status" id="status">正在打开三维场景…</p>
</main>
<footer><span>拖动环看 · 滚轮或双指缩放 · 点地面移至该处 · Home 归位</span><a href="https://github.com/dragon717/SimulationWorld/blob/main/SOURCES.md">参考来源</a></footer>
<script type="module">
  import('./viewer.js').then(m => m.openHabitat()).catch(error => {
    document.querySelector('#status').textContent='当前显示场景渲染图。三维预览需要本地依赖和 WebGL 2。';
    console.error(error);
  });
</script>
</html>
