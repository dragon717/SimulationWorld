<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="modulepreload" href="./viewer.js">
<title>拉普蒂河漫滩 · 玻璃生态博物馆</title>
<link rel="stylesheet" href="museum.css">
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
<header>
  <div class="mast"><p>玻璃生态博物馆</p><h1>拉普蒂河漫滩</h1><span>尼泊尔 · 奇特旺</span></div>
  <nav aria-label="观察位置">
    <button disabled data-view="habitat" aria-pressed="true"><img class="specimen" src="ui/river.webp" alt=""><span>全景</span></button>
    <button disabled data-view="chital" aria-label="花鹿" aria-pressed="false"><img class="specimen" src="ui/chital.webp" alt=""><span>花鹿<small></small></span></button>
    <button disabled data-view="tiger" aria-label="孟加拉虎" aria-pressed="false"><img class="specimen" src="ui/tiger.webp" alt=""><span>孟加拉虎<small></small></span></button>
    <button disabled data-view="mugger" aria-label="沼泽鳄" aria-pressed="false"><img class="specimen" src="ui/mugger.webp" alt=""><span>沼泽鳄<small></small></span></button>
  </nav>
</header>
<div id="world"><main id="viewport">
  <img src="previews/rapti-floodplain.jpg" alt="河道穿过草地，两头花鹿和一头孟加拉虎位于远岸，沼泽鳄伏在近岸浅水中。">
  <p id="wind-reading" class="field-label" hidden></p>
  <p id="individual" class="field-label" hidden></p>
  <p role="status" id="status" class="field-label">正在打开三维场景…</p>
</main>
<aside id="monitor" hidden aria-label="生态监控">
  <h2 class="cover-title">生态监控</h2>
  <div class="notes">
  <section class="fact-sheet"><div>草总量 <strong id="grass-total"></strong></div><div>状态哈希 <code id="world-hash"></code></div></section>
  <section><div class="section-head"><h2>种群曲线</h2><div class="series" aria-label="选择曲线"><button data-series="deer" aria-pressed="true">鹿</button><button data-series="tiger" aria-pressed="false">虎</button><button data-series="crocodile" aria-pressed="false">鳄</button></div></div>
  <canvas id="history" width="280" height="72" aria-label="所选物种种群历史"></canvas><p id="range"></p></section>
  <section><h2>世界小地图</h2><div class="map-key"><div id="minimap"><canvas id="map-field"></canvas><canvas id="world-map" width="160" height="160" aria-label="河道、种群位置及当前视野"></canvas></div>
  <p>棕鹿 · 橙虎 · 墨绿鳄<br>小点为幼体<br>白卵 · 褐色遗骸<br>青色水面 · 黄褐淤泥</p></div></section>
  <section><h2>最近事件</h2><ol></ol></section></div>
</aside></div>
<section id="simulation" aria-label="生态演化" hidden>
  <div class="commands"><button id="play" disabled>开始演化</button><button id="step" disabled>单步</button>
    <label>速度 <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20">20×</option></select></label>
    <label>种子 <input id="seed" inputmode="numeric" maxlength="20"></label><button id="reset" disabled>按种子重置</button></div>
  <div class="readings"><span>第 <b id="tick">0</b> 步</span><span id="climate"></span><span id="remains"></span><span id="event"></span></div>
  <span role="status" id="sim-note"></span>
</section>
<footer><span>拖动环看 · 滚轮或双指缩放 · 点水面激起涟漪 · Home 归位</span><span><a id="mode" href="?view=habitat">查看原始场景</a><a href="https://github.com/dragon717/SimulationWorld/blob/main/SOURCES.md">参考来源</a></span></footer>
<script type="module">
  import('./viewer.js').then(m => m.openHabitat()).catch(error => {
    document.querySelector('#status').textContent='场景未能打开。请用启动游戏脚本重启服务，并检查浏览器是否支持 WebGL 2。';
    console.error(error);
  });
</script>
</html>
