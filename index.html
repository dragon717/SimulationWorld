<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<link rel="modulepreload" href="./viewer.js">
<title>拉普蒂河漫滩 · 模拟世界</title>
<style>
  :root {color-scheme:light; color:#233e34; background:#f4f1e8; font:16px Georgia,"Songti SC","Noto Serif CJK SC",serif}
  * {box-sizing:border-box}
  body {margin:0; min-height:100svh; display:grid; grid-template-rows:auto minmax(300px,1fr) auto auto}
  header, footer {display:flex; align-items:center; gap:12px 30px; padding:18px clamp(18px,4vw,70px); flex-wrap:wrap}
  header {justify-content:space-between; border-bottom:1px solid #c7c7b7}
  h1 {font-size:clamp(24px,3.8vw,45px); font-weight:500; margin:0; letter-spacing:.065em}
  header p {margin:0 0 5px; color:#667260; font-size:13px}
  nav {display:flex; gap:6px; flex-wrap:wrap}
  button, footer {font:14px system-ui,sans-serif}
  button {padding:8px 11px; border:1px solid transparent; border-radius:2px; background:transparent; color:inherit; cursor:pointer}
  button[aria-pressed=true] {color:#fffaf0; background:#385246}
  button:enabled:hover {border-color:#738775}
  button:focus-visible,canvas:focus-visible {outline:2px solid #976234; outline-offset:-2px}
  button:disabled {cursor:wait}
  main {position:relative; min-height:45svh; overflow:hidden; background:#e9e6da}
  main img,main canvas {display:block; width:100%; height:100%; position:absolute; inset:0; object-fit:contain}
  main [hidden] {display:none}
  #status,#individual {position:absolute; left:18px; bottom:10px; margin:0; padding:5px 9px; background:#fffcf0; font-size:14px}
  footer {justify-content:space-between; color:#546155; padding-block:12px}
  footer a {color:inherit}
  #simulation {padding:10px clamp(18px,4vw,70px);border-top:1px solid #c7c7b7;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;font:14px system-ui,sans-serif}
  #simulation[hidden] {display:none}
  .commands,.readings {display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px}
  .commands button {border-color:#bdc3b5}
  #play {background:#385246;color:#fffaf0}
  .commands input,.commands select {font:inherit;color:inherit;border:1px solid #bdc3b5;background:transparent;padding:4px}
  #seed {width:10ch}
  nav small {padding-left:4px;font-variant-numeric:tabular-nums}
  #sim-note {color:#924824}
  footer span:last-child {display:flex;gap:18px}
  #world {min-height:0;display:grid;grid-template-columns:minmax(0,1fr) auto}
  #monitor {font:13px system-ui,sans-serif;width:clamp(220px,21vw,310px);max-height:70svh;overflow:auto;padding:12px 16px;border-left:1px solid #c7c7b7}
  #monitor h2 {font-size:15px;margin:8px 0} #monitor p {margin:5px 0 10px}
  #monitor ol {padding:0;list-style:none;margin:4px 0;font-size:12px;line-height:1.8}
  #monitor button {padding:2px 8px}
  #history {width:100%;height:64px}
  #minimap {position:relative;height:105px;aspect-ratio:1;margin:auto} #minimap canvas {position:absolute;width:100%;height:100%}
  #world-hash {font:11px monospace} #range {font-size:11px}
  @media(max-width:720px){#world {display:flex;flex-direction:column} #monitor {width:auto;max-height:22svh;border-left:0;border-top:1px solid #c7c7b7} #viewport {flex:1} }
  @media(max-width:620px) {header {gap:10px; padding-block:12px} nav {gap:2px} button {padding:7px} footer {font-size:12px; gap:6px}}
</style>
<script type="importmap">
{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}
</script>
<header>
  <div><p>尼泊尔 · 奇特旺</p><h1>拉普蒂河漫滩</h1></div>
  <nav aria-label="观察位置">
    <button disabled data-view="habitat" aria-pressed="true">全景</button>
    <button disabled data-view="chital" aria-label="花鹿" aria-pressed="false">花鹿<small></small></button>
    <button disabled data-view="tiger" aria-label="孟加拉虎" aria-pressed="false">孟加拉虎<small></small></button>
    <button disabled data-view="mugger" aria-label="沼泽鳄" aria-pressed="false">沼泽鳄<small></small></button>
  </nav>
</header>
<div id="world"><main id="viewport">
  <img src="previews/rapti-floodplain.jpg" alt="河道穿过草地，两头花鹿和一头孟加拉虎位于远岸，沼泽鳄伏在近岸浅水中。">
  <p id="individual" hidden></p>
  <p role="status" id="status">正在打开三维场景…</p>
</main>
<aside id="monitor" hidden aria-label="生态监控">
  <h2>生态监控</h2><p>草总量 <strong id="grass-total"></strong><br>状态哈希 <code id="world-hash"></code></p>
  <h2>种群曲线</h2><div aria-label="选择曲线"><button data-series="deer" aria-pressed="true">鹿</button><button data-series="tiger" aria-pressed="false">虎</button><button data-series="crocodile" aria-pressed="false">鳄</button></div>
  <canvas id="history" width="280" height="72" aria-label="所选物种种群历史"></canvas><p id="range"></p>
  <h2>世界小地图</h2><div id="minimap"><canvas id="map-field"></canvas><canvas id="world-map" width="160" height="160" aria-label="河道、种群位置及当前视野"></canvas></div>
  <p>棕鹿 · 橙虎 · 墨绿鳄（小点为幼体）<br>白卵 · 褐色遗骸 · 青色水面 · 黄褐淤泥</p>
  <h2>最近事件</h2><ol></ol>
</aside></div>
<section id="simulation" aria-label="生态演化" hidden>
  <div class="commands"><button id="play" disabled>开始演化</button><button id="step" disabled>单步</button>
    <label>速度 <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20">20×</option></select></label>
    <label>种子 <input id="seed" inputmode="numeric" maxlength="20"></label><button id="reset" disabled>按种子重置</button></div>
  <div class="readings"><span>第 <b id="tick">0</b> 步</span><span id="climate"></span><span id="remains"></span><span id="event"></span></div>
  <span role="status" id="sim-note"></span>
</section>
<footer><span>拖动环看 · 滚轮或双指缩放 · 点地面移至该处 · Home 归位</span><span><a id="mode" href="?view=habitat">查看原始场景</a><a href="https://github.com/dragon717/SimulationWorld/blob/main/SOURCES.md">参考来源</a></span></footer>
<script type="module">
  import('./viewer.js').then(m => m.openHabitat()).catch(error => {
    document.querySelector('#status').textContent='场景未能打开。请用启动游戏脚本重启服务，并检查浏览器是否支持 WebGL 2。';
    console.error(error);
  });
</script>
</html>
